<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insta Auto Liker v1.2.0</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <img src="icons/icon48.png" width="28" height="28" alt="logo" />
        <div>
          <div class="app-name">Auto Liker & Commenter</div>
          <div class="version">v1.2.0</div>
        </div>
      </div>
      <div id="status-badge" class="badge badge-idle">Idle</div>
    </div>

    <!-- Mode Selector -->
    <div class="section-label">Mode</div>
    <div class="mode-grid">
      <button class="mode-btn active" data-mode="like">
        <span class="mode-icon">❤️</span>
        <span>Like Only</span>
      </button>
      <button class="mode-btn" data-mode="comment">
        <span class="mode-icon">💬</span>
        <span>Comment Only</span>
      </button>
      <button class="mode-btn" data-mode="both">
        <span class="mode-icon">🔥</span>
        <span>Like + Comment</span>
      </button>
      <button class="mode-btn" data-mode="preview">
        <span class="mode-icon">✨</span>
        <span>Generate & Copy</span>
      </button>
    </div>

    <!-- Speed / Delay -->
    <div class="section-label">Delay between posts</div>
    <div class="speed-row">
      <button class="speed-pill active" data-ms="0">Instant</button>
      <button class="speed-pill" data-ms="1000">1s</button>
      <button class="speed-pill" data-ms="2000">2s</button>
      <button class="speed-pill" data-ms="5000">5s</button>
    </div>
    <div class="custom-delay-row">
      <input type="number" id="custom-delay" min="0" max="60000" placeholder="Custom ms" />
      <span>ms</span>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-num" id="stat-liked">0</div>
        <div class="stat-label">Liked</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-commented">0</div>
        <div class="stat-label">Commented</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-skipped">0</div>
        <div class="stat-label">Skipped</div>
      </div>
    </div>
    <div id="current-status" class="current-status">Idle</div>

    <!-- Controls -->
    <div class="controls">
      <button id="btn-start" class="btn btn-start">▶ Start</button>
      <button id="btn-pause" class="btn btn-pause" disabled>⏸ Pause</button>
      <button id="btn-stop" class="btn btn-stop" disabled>⏹ Stop</button>
    </div>

    <!-- AI Settings (collapsible) -->
    <details class="ai-section">
      <summary>🤖 AI Settings (for comments)</summary>
      <div class="ai-body">
        <div class="ai-row">
          <label>Provider</label>
          <select id="ai-provider">
            <option value="offline">Offline (built-in)</option>
            <option value="gemini">Gemini (Google)</option>
            <option value="openai">OpenAI (ChatGPT)</option>
            <option value="openrouter">OpenRouter (Free models)</option>
          </select>
        </div>
        <div class="ai-row">
          <label>API Key</label>
          <input type="password" id="ai-key" placeholder="Paste your API key" />
        </div>
        <div class="ai-row">
          <label>Model</label>
          <input type="text" id="ai-model" placeholder="e.g. gemini-1.5-flash" />
        </div>
        <button id="btn-save-ai" class="btn btn-save">💾 Save AI Settings</button>
        <div class="ai-hint">
          Leave provider as "Offline" if you don't have an API key — it uses 70+ built-in authentic phrases.
        </div>
      </div>
    </details>
  </div>
  <script src="popup.js"></script>
</body>
</html>
